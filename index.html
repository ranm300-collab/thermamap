<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ThermaMap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top-bar">
  <h1>ThermaMap</h1>
  <div id="wx">
    <span id="temp-now">--°F</span>
    <span id="temp-detail"></span>
    <span id="wx-time"></span>
  </div>
</header>
<div id="alert-banner" hidden>
  <div id="alert-headline"></div>
  <div id="alert-instruction"></div>
</div>
<div id="map"></div>

<button id="heat-toggle" type="button">Heat</button>
<div id="heat-legend" hidden>
  <div id="heat-legend-bar">
    <div id="heat-marker-start" class="heat-marker" hidden>
      <div class="heat-marker-label"></div>
      <div class="heat-marker-shape"></div>
    </div>
    <div id="heat-marker-dest" class="heat-marker" hidden>
      <div class="heat-marker-label"></div>
      <div class="heat-marker-shape"></div>
    </div>
  </div>
  <div id="heat-marker-start-nodata" class="heat-marker-nodata" hidden>start: no heat data here</div>
  <div id="heat-marker-dest-nodata" class="heat-marker-nodata" hidden>dest: no heat data here</div>
  <div id="heat-legend-caption">summer ground temps from nasa/usgs landsat</div>
</div>

<div id="search-card" hidden>
  <div id="start-slot"></div>
  <div id="current-location-row" hidden>Current location</div>
  <button id="swap-btn" type="button">⇅ swap</button>
  <div id="dest-slot"></div>
  <div id="search-error" hidden>search isn't loading right now</div>
  <div id="location-notice" hidden></div>
  <div id="mode-toggle">
    <button type="button" id="mode-walk" class="mode-btn active">Walk</button>
    <button type="button" id="mode-bike" class="mode-btn">Bike</button>
  </div>
  <div id="leave-row">
    <button type="button" id="leave-label-btn">Leave: Now</button>
    <input type="time" id="leave-time-input" hidden>
    <button type="button" id="leave-reset-btn" hidden>Now</button>
  </div>
  <div id="route-error" hidden></div>
</div>

<div id="route-cards-panel" hidden>
  <div id="route-sheet-handle"></div>
  <div id="leave-time-label"></div>
  <div id="route-cards"></div>
  <div id="route-color-key">
    <span class="route-color-key-item"><span class="route-color-key-bar shade"></span>shade</span>
    <span class="route-color-key-item"><span class="route-color-key-bar sun"></span>sun</span>
  </div>
</div>

<script src="js/config.js" defer></script>
<script src="js/map.js" defer></script>
<script src="js/heatlayer.js" defer></script>
<script src="js/grid.js" defer></script>
<script src="js/weather.js" defer></script>
<script src="js/refresh.js" defer></script>
<script src="js/search.js" defer></script>
<script src="js/routes.js" defer></script>
<script src="js/score.js" defer></script>
</body>
</html>
